name: Release

# A release is a bare X.Y.Z tag on main. The tag must equal VERSION and be a single valid bump of the previous release.
# It publishes the mod pack (Cairn-Pack-kcd2-X.Y.Z.zip) and pack-index.json: the launcher reads the index to update this mod.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Tag must be on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $env:GITHUB_REF_NAME is not on main" }

      - name: Versioning policy
        shell: pwsh
        run: ./tools/Test-VersionPolicy.ps1 -Tag $env:GITHUB_REF_NAME

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }

      - name: Build the pack
        shell: pwsh
        run: ./tools/Build-Pack.ps1   # the pack carries the menu bridge (docs/CAIRN.md); the smoke test below starts it

      - name: The programs of the pack start
        shell: pwsh
        run: ./tools/Test-PackSmoke.ps1

      - name: Changelog
        shell: pwsh
        run: ./tools/New-ReleaseNotes.ps1 -OutFile notes.md -Tag $env:GITHUB_REF_NAME

      - name: Check game.json and the release channel
        shell: pwsh
        run: ./tools/Test-GameJson.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # beside the pack: game.json and its pictures (the launcher reads what this game is from the latest release), flat
          $assets = @("release/Cairn-Pack-kcd2-$env:GITHUB_REF_NAME.zip", 'release/pack-index.json') + (Get-ChildItem game -File | ForEach-Object { $_.FullName })
          # RELEASE_CHANNEL=beta publishes a pre-release: only players who chose the beta channel are offered it
          $flags = @()
          if ((Get-Content RELEASE_CHANNEL -Raw).Trim() -eq 'beta') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @assets --title $env:GITHUB_REF_NAME --notes-file notes.md --verify-tag @flags
